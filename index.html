<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klassieke talen — athena campus Pottelberg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lufga:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blauw: #13427f;
    --roze: #E6007E;
    --fv: 'Lufga', Arial, sans-serif;
    --fo: 'Aptos', Arial, sans-serif;
    --rand: #dde3ec;
    --tekst: #1a1a1a;
    --tekst-zacht: #6b7280;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: var(--fv);
    color: var(--tekst);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse at 10% 0%, rgba(19,66,127,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 10%, rgba(230,0,126,0.05) 0%, transparent 50%),
      linear-gradient(160deg, #f4f6fb 0%, #f9f0f6 50%, #f3f7fc 100%);
  }

  /* ── HEADER ── */
  .site-header {
    display: flex;
    justify-content: center;
    padding: 1.6rem 1.5rem 0.5rem;
    flex-shrink: 0;
  }

  .school-logo {
    width: 150px;
    height: auto;
    display: block;
  }

  /* ── MAIN ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.8rem 1.5rem 1rem;
  }

  .keuze-titel {
    font-size: 26px;
    font-weight: 700;
    color: var(--blauw);
    text-align: center;
    margin-bottom: 0.3rem;
    letter-spacing: -0.5px;
  }

  .keuze-subtitel {
    font-size: 13px;
    color: var(--tekst-zacht);
    font-family: var(--fo);
    text-align: center;
    margin-bottom: 1.8rem;
  }

  /* ── KAARTEN ── */
  .taal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 1rem;
    width: 100%;
    max-width: 540px;
  }

  .taal-kaart {
    background: rgba(255,255,255,0.92);
    border: 0.5px solid var(--rand);
    border-radius: var(--radius);
    padding: 1.5rem 1.25rem;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
    box-shadow: 0 2px 10px rgba(19,66,127,0.05);
  }

  .taal-kaart.eerste-jaar:hover {
    border-color: var(--blauw);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(19,66,127,0.13);
  }

  .taal-kaart.tweede-jaar:hover {
    border-color: var(--roze);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(230,0,126,0.12);
  }

  .taal-icoon { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }
  .taal-icoon img { width: 60px; height: auto; }

  .taal-naam { font-size: 18px; font-weight: 600; }
  .taal-kaart.eerste-jaar .taal-naam { color: var(--blauw); }
  .taal-kaart.tweede-jaar .taal-naam { color: var(--roze); }

  .taal-omschrijving { font-family: var(--fo); font-size: 12.5px; color: var(--tekst-zacht); line-height: 1.5; }

  .taal-pijl { font-size: 18px; color: var(--rand); transition: color 0.18s; }
  .taal-kaart.eerste-jaar:hover .taal-pijl { color: var(--blauw); }
  .taal-kaart.tweede-jaar:hover .taal-pijl { color: var(--roze); }

  /* ── HERO ── */
  .hero-wrap {
    position: relative;
    width: 100%;
    flex-shrink: 0;
    line-height: 0;
    /* Vaste hoogte gebaseerd op beeldverhouding 1280:400 = 31.25vw,
       maar begrensd zodat de rest ook past */
    height: clamp(80px, 22vw, 200px);
    overflow: hidden;
  }

  .hero-img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center center;
  }

  .hero-credit {
    position: absolute;
    bottom: 8px;
    right: 14px;
    font-family: var(--fo);
    font-size: 9px;
    color: rgba(255,255,255,0.32);
    letter-spacing: 0.3px;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>

  <header class="site-header">
    <img class="school-logo" src="images/nav/logo_athena_baseline.png" alt="athena secundair onderwijs" />
  </header>

  <main>
    <h1 class="keuze-titel">Klassieke talen</h1>
    <p class="keuze-subtitel">Kies je jaar om verder te gaan.</p>

    <div class="taal-grid">

      <a class="taal-kaart eerste-jaar" href="athenalatijn1egraad/1ejaar/index.html">
        <div class="taal-icoon"><img src="images/cards/tegel_1ejaar.svg" alt="1e jaar" /></div>
        <div class="taal-naam">1e jaar</div>
        <div class="taal-omschrijving">Grammatica, teksten, vocabularium en oefeningen.</div>
        <div class="taal-pijl">&#x203A;</div>
      </a>

      <a class="taal-kaart tweede-jaar" href="athenalatijn1egraad/2ejaar/index.html">
        <div class="taal-icoon"><img src="images/cards/tegel_2ejaar.svg" alt="2e jaar" /></div>
        <div class="taal-naam">2e jaar</div>
        <div class="taal-omschrijving">Grammatica, vocabularium en oefeningen.</div>
        <div class="taal-pijl">&#x203A;</div>
      </a>

    </div>
  </main>

  <div class="hero-wrap">
    <img class="hero-img" src="images/heroes/hero_athena_horizontaal.png" alt="" />
    <span class="hero-credit">&copy; 2026 J. Everaerdt</span>
  </div>

</body>
</html>
