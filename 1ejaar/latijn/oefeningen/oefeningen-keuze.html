<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oefeningen — 1e jaar Latijn — athena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lufga:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blauw:       #13427f;
    --blauw-licht: rgba(19,66,127,.08);
    --roze:        #E6007E;
    --kaart:       #ffffff;
    --achtergrond: #f7f8fa;
    --rand:        #e2e6ed;
    --tekst:       #1a1a1a;
    --tekst-zacht: #6b7280;
    --radius:      16px;
    --radius-sm:   12px;
    --fv: 'Lufga', Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--fv);
    background: var(--achtergrond);
    color: var(--tekst);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── MERKLINT athena: laag 1 ── */
  .site-header {
    background: var(--blauw);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: .85rem 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
    position: relative;
  }
  .site-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--roze);
  }
  .site-header .logo {
    height: 34px;
    width: auto;
    display: block;
    flex-shrink: 0;
  }
  .site-header h1 {
    font-family: var(--fv);
    font-weight: 700;
    font-size: 1.2rem;
    margin: 0;
    letter-spacing: .02em;
    white-space: nowrap;
    color: #fff;
  }
  .site-header .school-naam {
    font-family: var(--fv);
    font-size: .65rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .85;
    margin-left: auto;
    white-space: nowrap;
    padding-left: .5rem;
    color: #fff;
  }

  /* ── MERKLINT athena: laag 2 ── */
  .site-toolbar {
    background: var(--achtergrond);
    border-bottom: 1px solid var(--rand);
    padding: .55rem 1.5rem;
    display: flex;
    align-items: center;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .toolbar-divider {
    width: 1px;
    height: 22px;
    background: var(--rand);
    margin: 0 .25rem;
  }
  .back-btn, .pill-btn {
    font-family: var(--fv);
    font-size: .82rem;
    font-weight: 500;
    color: var(--blauw);
    background: transparent;
    border: 0.5px solid var(--rand);
    border-radius: 20px;
    padding: .32rem .85rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    transition: background .15s, border-color .15s, color .15s;
  }
  .back-btn:hover, .pill-btn:hover {
    background: var(--blauw);
    border-color: var(--blauw);
    color: #fff;
  }
  .back-btn svg { width: 14px; height: 14px; }

  /* ── KAARTEN: exact dezelfde maatvoering als latijn.html ── */
  .nav-wrap {
    flex: 1;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: clamp(6.5rem, 12vh, 10rem) 2rem 3.5rem;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .nav-grid {
    display: grid;
    grid-template-columns: repeat(2, 245px);
    gap: 1.25rem;
    justify-content: center;
    width: auto;
    max-width: 510px;
  }

  .nav-tegel {
    width: 245px;
    min-height: 255px;
    background: var(--kaart);
    border: 0.5px solid var(--rand);
    border-radius: var(--radius);
    padding: 2rem 1.35rem 1.65rem;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .nav-tegel:hover {
    border-color: var(--blauw);
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(19,66,127,.06);
  }

  .nav-tegel-icoon {
    width: 72px;
    height: 72px;
    border-radius: 0;
    background: transparent !important;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-bottom: .15rem;
    color: var(--blauw);
  }
  .nav-tegel-icoon svg {
    width: 58px;
    height: 58px;
    stroke: currentColor;
    stroke-width: 1.8;
  }

  .nav-tegel-naam {
    font-family: 'Lufga', Arial, sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--roze);
    line-height: 1.2;
  }

  .nav-tegel-omschrijving {
    font-family: var(--fv);
    font-size: 13px;
    font-weight: 400;
    color: var(--tekst-zacht);
    line-height: 1.55;
    max-width: 210px;
  }

  .nav-tegel-pijl {
    margin-top: auto;
    font-size: 20px;
    color: var(--rand);
    transition: color 0.15s, transform 0.15s;
  }
  .nav-tegel:hover .nav-tegel-pijl {
    color: var(--blauw);
    transform: translateX(2px);
  }

  .voet {
    text-align: center;
    padding: 1rem;
    font-family: var(--fv);
    font-size: 11px;
    color: #b8bfc9;
  }

  @media (max-width: 680px) {
    .site-header { padding: .75rem 1rem; }
    .site-header h1 { font-size: 1.05rem; }
    .site-header .school-naam { display: none; }
    .site-toolbar { padding: .55rem 1rem; }
    .nav-wrap { padding: 3.5rem 1rem 2.5rem; }
    .nav-grid { grid-template-columns: minmax(0, 245px); max-width: 245px; }
    .nav-tegel { width: 245px; min-height: 230px; }
  }
</style>
</head>
<body>

<!-- MERKLINT laag 1 -->
<header class="site-header">
  <img class="logo" src="/athenalatijn1egraad/images/nav/logo_wit.png" alt="athena" onerror="this.onerror=null;this.src='../../../images/nav/logo_wit.png';">
  <h1>Oefeningen</h1>
  <span class="school-naam">athena Campus Pottelberg</span>
</header>

<!-- MERKLINT laag 2: toolbar -->
<nav class="site-toolbar">
  <a class="back-btn" href="../latijn.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Terug naar overzicht
  </a>
  <div class="toolbar-divider"></div>
  <a class="pill-btn" href="grammatica-keuze.html">Grammatica</a>
  <a class="pill-btn" href="woordenschat/woordjestrainer.html">Woordenschat</a>
</nav>

<!-- TEGELS -->
<main class="nav-wrap">
  <div class="nav-grid">

    <a class="nav-tegel" href="grammatica-keuze.html">
      <div class="nav-tegel-icoon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
      </div>
      <div class="nav-tegel-naam">Grammatica</div>
      <div class="nav-tegel-omschrijving">Oefen verbuigingen, vervoegingen en andere grammaticaonderwerpen.</div>
      <div class="nav-tegel-pijl">›</div>
    </a>

    <a class="nav-tegel" href="woordjestrainer.html">
      <div class="nav-tegel-icoon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </div>
      <div class="nav-tegel-naam">Woordenschat</div>
      <div class="nav-tegel-omschrijving">Latijnse woorden inoefenen via de woordenlijst van de cursus.</div>
      <div class="nav-tegel-pijl">›</div>
    </a>

  </div>
</main>

<p class="voet">J. Everaerdt &mdash; athena Campus Pottelberg</p>
</body>
</html>
