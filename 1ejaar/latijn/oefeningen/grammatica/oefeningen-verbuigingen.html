l:'maria',gen_pl:'marium',dat_pl:'maribus',abl_pl:'maribus'}})

function N(nom,stem,gen,gender,nlSing,nlPl,decl,extra={}){return{nom,stem,gen,gender,nlSing,nlPl,decl,...extra}}

if(noun.decl==='u')return{nom_sg:noun.nom,acc_sg:s+'um',gen_sg:s+'us',dat_sg:s+'ui',abl_sg:s+'u',nom_pl:s+'us',acc_pl:s+'us',gen_pl:s+'uum',dat_pl:s+'ibus',abl_pl:s+'ibus'}[id];
return{nom_sg:noun.nom,acc_sg:s+'em',gen_sg:s+'ei',dat_sg:s+'ei',abl_sg:s+'e',nom_pl:s+'es',acc_pl:s+'es',gen_pl:s+'erum',dat_pl:s+'ebus',abl_pl:s+'ebus'}[id]}

function translation(noun,c,n){const word=n==='sg'?noun.nlSing:noun.nlPl;const article=(noun.gender==='n'?(n==='sg'?'het ':'de '):'de ')+word; if(c==='gen')return 'van '+article;if(c==='dat')return 'aan/voor '+article;if(c==='abl')return 'door/met '+article;return article}

function shuffled(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function questionInput(prompt,answer,explanation,errorType,help,accepted=[]){return{kind:'input',prompt,answer,accepted:[answer,...accepted],explanation,errorType,help}}
function correctGenQ(mod,noun,r){const options=shuffled([noun.gen,...otherNouns(mod,noun,r).map(n=>n.gen)],r);return questionMC(`Wat is de <strong>genitief enkelvoud</strong> van <em>${noun.nom}</em>?`,options,options.indexOf(noun.gen),`De genitief enkelvoud van <em>${noun.nom}</em> is <strong>${noun.gen}</strong>. Daarin zie je de stam <strong>${noun.stem}-</strong>.`,'stam','Zoek de tweede vorm uit de woordenlijst. Die eindigt bij deze verbuiging op de vaste genitiefuitgang.')}
function stemQ(mod,noun,r){const options=shuffled([noun.stem+'-',...otherNouns(mod,noun,r).map(n=>n.stem+'-')],r);return questionMC(`Welke stam hoort bij <em>${noun.nom}, ${noun.gen}</em>?`,options,options.indexOf(noun.stem+'-'),`Neem bij <em>${noun.gen}</em> de genitiefuitgang weg. Je houdt <strong>${noun.stem}-</strong> over.`,'stam','De stam vind je altijd vanuit de genitief enkelvoud, niet vanuit de nominatief.')}
function genderQ(mod,noun,r){const genders=['mannelijk','vrouwelijk','onzijdig'];let correct=noun.gender==='m'?'mannelijk':noun.gender==='f'?'vrouwelijk':noun.gender==='n'?'onzijdig':'mannelijk of vrouwelijk';const opts= noun.gender==='m/v'?['mannelijk of vrouwelijk','mannelijk','vrouwelijk','onzijdig']:shuffled([correct,...genders.filter(x=>x!==correct)],r);return questionMC(`Welk geslacht heeft <em>${noun.nom}, ${noun.gen}</em>?`,opts,opts.indexOf(correct),`<em>${noun.nom}</em> is <strong>${correct}</strong>. Controleer bij twijfel altijd je woordenlijst.`,'geslacht','Kijk naar de afkorting in de woordenlijst: m., vr. of onz.')}
function ruleQ(mod,r){const trueRule=choose(mod.rules,r);const falseRules=['De nominatief enkelvoud vertelt altijd de stam precies.','Elke genitief enkelvoud eindigt in het Latijn op -ae.','Nominatief en accusatief zijn bij alle woorden altijd verschillend.','De datief enkelvoud is altijd gelijk aan de ablativus enkelvoud.'];const opts=shuffled([trueRule,...shuffled(falseRules,r).slice(0,3)],r);return questionMC('Welke uitspraak is juist?',opts,opts.indexOf(trueRule),`Juist: <strong>${trueRule}</strong>`,'regel','Denk aan de vaste regel die boven de tabel van deze verbuiging staat.')}
function formQ(mod,noun,c,n,r,input=false){const ans=form(noun,c,n);const prompt=`Geef de vorm <strong>${formLabel(c,n)}</strong> van <em>${noun.nom}, ${noun.gen}</em>.`;const help=`Vertrek van de stam <strong>${noun.stem}-</strong>. Kies daarna de uitgang voor ${CASE_LABEL[c]} ${NUM_LABEL[n]}.`;if(input)return questionInput(prompt,ans,`De juiste vorm is <strong>${ans}</strong>: ${noun.stem}- + de juiste uitgang.`, 'uitgang',help);const distractors=shuffled(CASES.flatMap(cc=>['sg','pl'].map(nn=>form(noun,cc,nn))).filter(x=>x!==ans),r).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);const opts=shuffled([ans,...distractors],r);return questionMC(prompt,opts,opts.indexOf(ans),`De juiste vorm is <strong>${ans}</strong>. ${help}`,'uitgang',help)}
function analysisQ(mod,noun,c,n,r){const ans=`${formLabel(c,n,noun.gender==='m/v'?'':'')}`;const all=[];for(const cc of CASES)for(const nn of ['sg','pl'])all.push(`${formLabel(cc,nn)}`);const opts=shuffled([ans,...shuffled(all.filter(x=>x!==ans),r).slice(0,3)],r);return questionMC(`Welke analyse past bij <strong>${form(noun,c,n)}</strong> van <em>${noun.nom}</em>?`,opts,opts.indexOf(ans),`<strong>${form(noun,c,n)}</strong> is ${ans}. Kijk naar de uitgang en vergelijk met de tabel.`,'naamval','Bepaal eerst het getal. Kijk daarna welke naamval bij de uitgang past.')}
function translationQ(mod,noun,c,n,r){const ans=translation(noun,c,n);const all=shuffled(mod.nouns.filter(x=>x.nom!==noun.nom),r).slice(0,3).map(x=>translation(x,c,n));const opts=shuffled([ans,...all],r);return questionMC(`Vertaal <strong>${form(noun,c,n)}</strong>.`,opts,opts.indexOf(ans),`<strong>${form(noun,c,n)}</strong> betekent: <strong>${ans}</strong>.`, 'betekenis','Kijk eerst naar naamval en getal. Kies daarna de passende Nederlandse voorzetselvertaling.')}
function correctionQ(mod,noun,c,n,r){const correct=form(noun,c,n);let wrong=form(noun,c==='nom'?'acc':'nom',n);if(wrong===correct)wrong=form(noun,c,n==='sg'?'pl':'sg');const opts=shuffled([correct,wrong,...otherNouns(mod,noun,r,2).map(x=>form(x,c,n))],r);return questionMC(`Een leerling schrijft <strong>${wrong}</strong>, maar hij/zij moet <strong>${formLabel(c,n)}</strong> van <em>${noun.nom}</em> vormen. Welke vorm is juist?`,opts,opts.indexOf(correct),`De juiste vorm is <strong>${correct}</strong>. De gevraagde naamval en het gevraagde getal bepalen de uitgang.`,'uitgang','Lees de vraag opnieuw: welke naamval én welk getal staan er precies?')}
function phraseQ(mod,noun,r){const patterns=[{prep:'ad',c:'acc',text:'naar'},{prep:'cum',c:'abl',text:'met'},{prep:'pars',c:'gen',text:'een deel van'},{prep:'in',c:'abl',text:'in/op'}];const p=choose(patterns,r);const n=choose(['sg','pl'],r);const ans=form(noun,p.c,n);const options=shuffled([ans,...CASES.filter(c=>c!==p.c).slice(0,3).map(c=>form(noun,c,n))],r);return questionMC(`Vul aan: <strong>${p.prep} ___</strong> — ${p.text} ${translation(noun,'nom',n)}.`,options,options.indexOf(ans),`Na <strong>${p.prep}</strong> gebruik je hier de ${CASE_LABEL[p.c]}. De juiste vorm is <strong>${ans}</strong>.`,'naamval',`Het woordje <strong>${p.prep}</strong> helpt je: het vertelt welke naamval nodig is.`)}
function exceptionQ(mod,r){if(mod.key==='gemengde'){const noun=choose(mod.nouns.filter(n=>n.nom==='urbs'||n.nom==='mare'),r);const c=noun.nom==='urbs'?'gen':'nom';const n='pl';return formQ(mod,noun,c,n,r,false)}if(mod.key==='u'){const noun=mod.nouns.find(n=>n.nom==='domus');const c=choose(['abl','acc','gen'],r);const n=choose(['sg','pl'],r);return formQ(mod,noun,c,n,r,false)}const noun=mod.nouns.find(n=>n.nom==='dies');return questionMC('Welk woord is in deze reeks meestal <strong>mannelijk</strong>?',['res','fides','dies','spes'],2,'<strong>dies</strong> is meestal mannelijk. De woorden van de e-verbuiging zijn anders meestal vrouwelijk.','geslacht','De e-verbuiging is meestal vrouwelijk; onthoud dat dies een bekende uitzondering is.')}
function makeQuestions(key,level,exercise){const mod=MODULES[key];const r=seeded((key==='gemengde'?401:key==='u'?701:1001)+level*97+exercise*17);const qs=[];for(let i=0;i<10;i++){const noun=choose(mod.nouns,r);if(level===1){if(exercise===1)qs.push(correctGenQ(mod,noun,r));else if(exercise===2)qs.push(stemQ(mod,noun,r));else if(exercise===3)qs.push(genderQ(mod,noun,r));else qs.push(i<6?ruleQ(mod,r):exceptionQ(mod,r));}
else if(level===2){const c=choose(CASES,r),n=choose(['sg','pl'],r);if(exercise===1)qs.push(formQ(mod,noun,c,n,r,false));else if(exercise===2)qs.push(formQ(mod,noun,c,n,r,true));else if(exercise===3)qs.push(analysisQ(mod,noun,c,n,r));else qs.push(translationQ(mod,noun,c,n,r));}
else{const c=choose(CASES,r),n=choose(['sg','pl'],r);if(exercise===1)qs.push(correctionQ(mod,noun,c,n,r));else if(exercise===2)qs.push(phraseQ(mod,noun,r));else if(exercise===3)qs.push(i<5?analysisQ(mod,noun,c,n,r):translationQ(mod,noun,c,n,r));else qs.push(i<5?exceptionQ(mod,r):formQ(mod,noun,c,n,r,true));}}
return qs}
function getStats(d,key){const st=moduleState(d,key);const ex=st.exercises||{};const byLevel={};for(let l=1;l<=3;l++){const vals=[];for(let e=1;e<=4;e++){const x=ex[`${l}-${e}`];vals.push(x&&typeof x.best==='number'?x.best:null)}const done=vals.filter(v=>v!==null).length;const sum=vals.reduce((s,v)=>s+(v===null?0:v),0);byLevel[l]={vals,done,sum,passed:done===4&&sum>=32}}const highest=byLevel[3].passed?4:byLevel[2].passed?3:byLevel[1].passed?2:1;const allScores=Object.values(ex).map(x=>x.best).filter(v=>typeof v==='number');return{byLevel,highest,completed:allScores.length,total:12,average:allScores.length?Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length*10):0}}
function allStats(d){const result={};Object.keys(MODULES).forEach(k=>result[k]=getStats(d,k));return result}
function app(){return document.getElementById('app')}
function esc(s){return String(s||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function setName(value){const d=data();d.name=value.trim();save(d);render()}
function renderHome(){const d=data(),stats=allStats(d);app().innerHTML=`<section class="intro"><h2>Verbuigingen</h2><p>Werk stap voor stap. Per onderwerp maak je vier oefeningen per niveau. Je gaat pas verder wanneer je over die vier oefeningen samen minstens <strong>32/40 = 80%</strong> behaalt.</p></section><div class="student-bar"><label for="studentName">Jouw naam</label><input id="studentName" value="${esc(d.name)}" placeholder="Voornaam en naam" autocomplete="name"><span class="student-status">${d.name?'Je voortgang wordt op dit toestel bewaard.':'Vul je naam in om je voortgang te bewaren en later te kunnen doorsturen.'}</span></div><section class="dash"><div class="dash-card"><h3>Jouw voortgang</h3><div class="progress-list">${Object.keys(MODULES).map(k=>{const s=stats[k];return `<div class="progress-row"><strong>${MODULES[k].short}</strong><div class="progress-track"><div class="progress-fill" style="width:${Math.round(s.completed/s.total*100)}%"></div></div><span class="badge ${s.completed===12?'good':''}">${s.completed}/${s.total}</span></div>`}).join('')}</div></div><div class="dash-card"><h3>Zo werk je</h3><p><strong>Niveau 1</strong>: herkennen.<br><strong>Niveau 2</strong>: vormen en bepalen.<br><strong>Niveau 3</strong>: toepassen in context.<br><br>Bij elke fout krijg je meteen een korte uitleg.</p></div></section><section class="module-grid">${Object.keys(MODULES).map(k=>{const m=MODULES[k],s=stats[k];return `<a class="module-card" href="#${k}"><div class="module-icon">${m.icon}</div><h3>${m.title}</h3><p>${m.description}</p><span class="badge ${s.completed===12?'good':''}">${s.completed}/12 oefeningen</span><div class="arrow">›</div></a>`}).join('')}</section>`;document.getElementById('studentName').addEventListener('change',e=>setName(e.target.value));}
function renderModule(key){const d=data(),m=MODULES[key],s=getStats(d,key);app().innerHTML=`<section class="overview"><div class="crumb"><a href="#home">‹ Alle verbuigingen</a><span>›</span><span>${m.title}</span></div><div class="module-title"><div><h2>${m.title}</h2><p>${m.description}</p></div><div class="score-box"><strong>${s.completed}/12</strong><span>oefeningen gemaakt</span></div></div><section class="dash"><div class="dash-card"><h3>Wat moet je onthouden?</h3><p>${m.rules.map(x=>'• '+x).join('<br>')}</p></div><div class="dash-card"><h3>Jouw route</h3><p>Voltooi de vier oefeningen van een niveau. Samen heb je minstens <strong>32/40</strong> nodig om het volgende niveau te openen.</p></div></section><section class="level-grid">${[1,2,3].map(l=>levelCard(key,l,s)).join('')}</section></section>`}
function levelCard(key,l,s){const unlocked=l<=s.highest;const info=s.byLevel[l];const pct=Math.round(info.sum/40*100);return `<article class="level-card ${unlocked?'':'locked'}"><h3>Niveau ${l}</h3><p class="sub">${l===1?'Herkennen en begrijpen.':l===2?'Vormen, bepalen en vertalen.':'Toepassen en fouten verbeteren.'}</p><p class="level-score">Beste scores samen: <strong>${info.sum}/40</strong></p><div class="mini-track"><div class="mini-fill" style="width:${pct}%"></div></div><div class="exercise-list">${[1,2,3,4].map(e=>{const x=info.vals[e-1];return `<button class="exercise-btn" ${unlocked?'':'disabled'} data-start="${key}|${l}|${e}"><strong>Oefening ${e}</strong><span class="${x!==null&&x>=8?'passed':''}">${x===null?'nog niet gemaakt':`${x}/10`}</span></button>`}).join('')}</div>${!unlocked?`<p class="locked-note">Maak niveau ${l-1} volledig af en behaal samen minstens 32/40.</p>`:info.passed?'<p class="locked-note" style="background:var(--groen-bg);color:var(--groen)">Niveau behaald. Goed gewerkt.</p>':''}</article>`}
function renderExercise(key,l,e){const m=MODULES[key],qs=makeQuestions(key,l,e),d=data(),prior=(moduleState(d,key).exercises||{})[`${l}-${e}`];app().innerHTML=`<section class="exercise-view"><div class="crumb"><a href="#${key}">‹ ${m.title}</a><span>›</span><span>Niveau ${l}, oefening ${e}</span></div><div class="exercise-head"><div><h2>${m.title}</h2><p>Niveau ${l} · oefening ${e} · 10 vragen</p></div><div class="score-box"><strong>${prior?`${prior.best}/10`:'—'}</strong><span>beste score</span></div></div><div class="question-list">${qs.map((q,i)=>renderQuestion(q,i)).join('')}</div><div class="action-row"><button class="primary" id="checkBtn">Verbeter mijn oefening</button><a class="secondary" href="#${key}">Terug naar overzicht</a></div><div class="summary hidden" id="summary"></div></section>`;document.getElementById('checkBtn').addEventListener('click',()=>checkExercise(key,l,e,qs));}
function renderQuestion(q,i){const content=q.kind==='mc'?`<div class="choices">${q.options.map(o=>`<label class="choice"><input type="radio" name="q${i}" value="${o.id}"><span>${o.text}</span></label>`).join('')}</div>`:`<input class="answer-input" id="q${i}" autocomplete="off" placeholder="Schrijf je antwoord hier">`;return `<article class="question" id="question-${i}"><div class="q-top"><div class="q-no">${i+1}</div><div class="q-prompt">${q.prompt}</div></div><details class="q-help"><summary>Hulp nodig? Werk in stapjes.</summary><p>${q.help}</p></details>${content}<div class="feedback hidden" id="feedback-${i}"></div></article>`}
function selected(q,i){if(q.kind==='mc'){const x=document.querySelector(`input[name="q${i}"]:checked`);return x?x.value:''}return document.getElementById('q'+i).value}
function checkExercise(key,l,e,qs){let score=0;const errors={};qs.forEach((q,i)=>{const got=selected(q,i);const good=q.kind==='mc'?got===q.answer:q.accepted.map(normalize).includes(normalize(got));const box=document.getElementById('question-'+i),fb=document.getElementById('feedback-'+i);box.classList.remove('correct','wrong');box.classList.add(good?'correct':'wrong');if(good)score++;else errors[q.errorType]=(errors[q.errorType]||0)+1;fb.className='feedback '+(good?'good':'bad');const answer=q.kind==='mc'?q.options.find(x=>x.id===q.answer).text:q.answer;fb.innerHTML=good?`<strong>Juist.</strong>${q.explanation}`:`<strong>Nog niet juist.</strong><div class="answer-line">Juiste antwoord: <strong>${answer}</strong>.</div><div class="answer-line">${q.explanation}</div>`;});const d=data(),st=moduleState(d,key),id=`${l}-${e}`,old=st.exercises[id]||{};st.exercises[id]={best:Math.max(old.best||0,score),last:score,attempts:(old.attempts||0)+1,updatedAt:new Date().toISOString()};Object.entries(errors).forEach(([k,v])=>{st.errors[k]=(st.errors[k]||0)+v;d.verbuigingenV1.errors[k]=(d.verbuigingenV1.errors[k]||0)+v});d.verbuigingenV1.lastActivity=new Date().toISOString();d.verbuigingenV1.lastExercise=`${MODULES[key].title} · niveau ${l}, oefening ${e}`;save(d);sendProgress(d);const stats=getStats(d,key);const top=Object.entries(errors).sort((a,b)=>b[1]-a[1]);const summary=document.getElementById('summary');summary.classList.remove('hidden');summary.innerHTML=`<h3>${score>=8?'Goed gedaan.':'Oefen nog eens verder.'}</h3><div class="result">${score}/10</div><p>${score>=8?'Je behaalde minstens 80% op deze oefening. Je beste score is bewaard.':'Je beste score is bewaard. Lees de uitleg bij je fouten en probeer deze oefening later opnieuw.'}</p><p>Niveau ${l}: beste scores samen <strong>${stats.byLevel[l].sum}/40</strong>. ${stats.byLevel[l].passed?'Het volgende niveau is nu open.':'Je hebt 32/40 nodig om door te gaan.'}</p>${top.length?`<div class="error-list">${top.map(([k])=>`<span class="error-tag">Aandachtspunt: ${errorLabel(k)}</span>`).join('')}</div>`:''}<div class="action-row"><a class="primary" href="#${key}">Naar mijn overzicht</a><button class="secondary" id="retryBtn">Deze oefening opnieuw maken</button></div>`;document.getElementById('retryBtn').addEventListener('click',()=>renderExercise(key,l,e));summary.scrollIntoView({behavior:'smooth',block:'start'});}
function errorLabel(k){return({stam:'stam vinden',geslacht:'geslacht herkennen',regel:'basisregel',uitgang:'juiste uitgang',naamval:'naamval herkennen',betekenis:'vertaling'})[k]||k}
function progressSummary(d){const stats=allStats(d);const modules={};let completed=0,total=0,sum=0;Object.keys(stats).forEach(k=>{const s=stats[k];completed+=s.completed;total+=s.total;sum+=s.average*s.completed;modules[k]={completed:s.completed,total:s.total,average:s.average,highestOpen:s.highest,complete:s.completed===12&&s.byLevel[3].passed};});const errors=d.verbuigingenV1.errors||{};const ordered=Object.entries(errors).sort((a,b)=>b[1]-a[1]);return{name:d.name||'',classId:CONFIG.classId||'1GR-LAT',school:CONFIG.school||'athena campus Pottelberg',course:'Latijn 1A1',product:'verbuigingen-1ejaar',schema:1,lastActivity:d.verbuigingenV1.lastActivity||new Date().toISOString(),lastExercise:d.verbuigingenV1.lastExercise||'',completed,total,average:completed?Math.round(sum/completed):0,modules,errors,errorCount:Object.values(errors).reduce((s,v)=>s+Number(v||0),0),topError:ordered.length?errorLabel(ordered[0][0]):''}}
function sendProgress(d){if(!d.name||!CONFIG.enabled||!CONFIG.endpoint)return;const payload={type:'latijn-voortgang',sentAt:new Date().toISOString(),summary:progressSummary(d)};try{fetch(CONFIG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).catch(()=>{});}catch(e){}}
function route(){const hash=decodeURIComponent(location.hash.slice(1));if(!hash||hash==='home'){renderHome();return}const p=hash.split('|');if(MODULES[p[0]]){if(p.length===1)renderModule(p[0]);else renderExercise(p[0],Number(p[1]),Number(p[2]));return}renderHome()}
window.addEventListener('hashchange',route);route();
</script>
</body>
