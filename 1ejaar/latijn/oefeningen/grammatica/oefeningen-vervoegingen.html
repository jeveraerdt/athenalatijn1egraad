*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--fv);background:var(--achtergrond);color:var(--tekst);min-height:100vh;display:flex;flex-direction:column}.site-header{background:var(--blauw);color:#fff;display:flex;align-items:center;gap:14px;padding:.85rem 1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.1);position:relative}.site-header:after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--roze)}.logo{height:34px;width:auto;display:block;flex-shrink:0}.site-header h1{font-weight:700;font-size:1.2rem;letter-spacing:.02em;white-space:nowrap}.school-naam{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-left:auto;white-space:nowrap;padding-left:.5rem}.site-toolbar{background:var(--achtergrond);border-bottom:1px solid var(--rand);padding:.55rem 1.5rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.toolbar-divider{width:1px;height:22px;background:var(--rand);margin:0 .25rem}.back-btn,.pill-btn{font-family:var(--fv);font-size:.82rem;font-weight:500;color:var(--blauw);background:transparent;border:.5px solid var(--rand);border-radius:20px;padding:.32rem .85rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;transition:background .15s,border-color .15s,color .15s}.back-btn:hover,.pill-btn:hover{background:var(--blauw);border-color:var(--blauw);color:#fff}.pill-btn.actief{background:var(--blauw);border-color:var(--blauw);color:#fff;cursor:default}.back-btn svg{width:14px;height:14px}.app{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:2rem 1.5rem 3rem}.intro{text-align:center;max-width:720px;margin:1.8rem auto 2rem}.intro h2{font-size:clamp(1.8rem,3vw,2.45rem);color:var(--roze);line-height:1.1}.intro p{margin-top:.65rem;color:var(--tekst-zacht);font-size:.93rem;line-height:1.6}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.25rem;max-width:940px;margin:0 auto}.module-card{background:var(--kaart);border:.5px solid var(--rand);border-radius:var(--radius);padding:1.7rem 1.35rem 1.35rem;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:260px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s,box-shadow .15s}.module-card:hover{transform:translateY(-3px);border-color:var(--blauw);box-shadow:0 10px 24px rgba(19,66,127,.07)}.module-icon{width:70px;height:70px;color:var(--blauw);display:flex;align-items:center;justify-content:center}.module-icon svg{width:58px;height:58px;stroke:currentColor;stroke-width:1.7}.module-card h3{font-size:19px;color:var(--roze);margin-top:8px}.module-card p{font-size:13px;color:var(--tekst-zacht);line-height:1.55;margin-top:8px;max-width:220px}.module-card .arrow{margin-top:auto;font-size:22px;color:var(--rand)}.student-bar{max-width:940px;margin:0 auto 1.4rem;background:var(--kaart);border:.5px solid var(--rand);border-radius:14px;padding:1rem 1.1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}.student-bar label{font-size:13px;color:var(--tekst-zacht);font-weight:600}.student-bar input{font:inherit;font-size:14px;border:1px solid var(--rand);border-radius:9px;padding:.55rem .7rem;min-width:210px;outline:none}.student-bar input:focus{border-color:var(--blauw)}.student-status{font-size:12px;color:var(--tekst-zacht);margin-left:auto}.dash{max-width:940px;margin:0 auto 1.8rem;display:grid;grid-template-columns:1.25fr .75fr;gap:1rem}.dash-card{background:var(--kaart);border:.5px solid var(--rand);border-radius:14px;padding:1.1rem 1.2rem}.dash-card h3{font-size:14px;color:var(--blauw);margin-bottom:.8rem}.dash-card p{font-size:12.5px;color:var(--tekst-zacht);line-height:1.5}.progress-list{display:grid;gap:.65rem}.progress-row{display:grid;grid-template-columns:125px 1fr auto;gap:.65rem;align-items:center;font-size:12px}.progress-row strong{font-size:12px;color:var(--blauw)}.progress-track{height:9px;background:#eef1f5;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:var(--roze);border-radius:inherit}.badge{font-size:11px;padding:3px 6px;border-radius:999px;background:var(--amber-bg);color:var(--amber);white-space:nowrap}.badge.good{background:var(--groen-bg);color:var(--groen)}.overview{max-width:940px;margin:0 auto}.crumb{font-size:13px;color:var(--tekst-zacht);display:flex;align-items:center;gap:.45rem;margin-bottom:1rem}.crumb a{color:var(--blauw);text-decoration:none}.crumb a:hover{text-decoration:underline}.module-title{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.module-title h2{font-size:28px;color:var(--roze);line-height:1.15}.module-title p{font-size:13.5px;color:var(--tekst-zacht);line-height:1.55;margin-top:.35rem;max-width:650px}.level-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.level-card{background:var(--kaart);border:.5px solid var(--rand);border-radius:14px;padding:1.15rem;position:relative;overflow:hidden}.level-card.locked{opacity:.62}.level-card h3{font-size:17px;color:var(--blauw)}.level-card .sub{font-size:12px;color:var(--tekst-zacht);margin-top:4px;line-height:1.45}.level-score{font-size:12px;color:var(--tekst-zacht);margin-top:.8rem}.mini-track{height:8px;background:#eef1f5;border-radius:99px;overflow:hidden;margin:.45rem 0 .8rem}.mini-fill{height:100%;background:var(--roze);border-radius:99px}.exercise-list{display:grid;gap:.5rem}.exercise-btn{border:1px solid var(--rand);background:#fff;border-radius:10px;padding:.65rem .7rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;font:inherit;text-align:left;color:var(--tekst);cursor:pointer;transition:border-color .15s,background .15s}.exercise-btn:hover:not(:disabled){border-color:var(--blauw);background:#fbfdff}.exercise-btn:disabled{cursor:not-allowed}.exercise-btn strong{font-size:13px;color:var(--blauw)}.exercise-btn span{font-size:11px;color:var(--tekst-zacht);white-space:nowrap}.exercise-btn .passed{color:var(--groen);font-weight:700}.locked-note{font-size:12px;color:var(--amber);line-height:1.5;margin-top:.8rem;padding:.65rem .7rem;border-radius:10px;background:var(--amber-bg)}.exercise-view{max-width:940px;margin:0 auto}.exercise-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.exercise-head h2{font-size:25px;color:var(--roze)}.exercise-head p{font-size:13px;color:var(--tekst-zacht);margin-top:4px}.score-box{background:var(--kaart);border:1px solid var(--rand);border-radius:12px;padding:.75rem 1rem;min-width:160px;text-align:center}.score-box strong{display:block;color:var(--blauw);font-size:19px}.score-box span{display:block;font-size:11px;color:var(--tekst-zacht);margin-top:3px}.question-list{display:grid;gap:1rem}.question{background:var(--kaart);border:.5px solid var(--rand);border-radius:14px;padding:1.1rem 1.15rem}.question.correct{border-color:#8bc48b;background:#fbfffb}.question.wrong{border-color:#f0b3ad;background:#fffafa}.q-top{display:flex;align-items:flex-start;gap:.75rem}.q-no{width:28px;height:28px;border-radius:50%;background:var(--blauw);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.q-prompt{font-size:15px;line-height:1.5;font-weight:600}.q-help{margin:.65rem 0 0 40px}.q-help summary{cursor:pointer;font-size:12px;color:var(--blauw);font-weight:600}.q-help p{font-size:12.5px;color:var(--tekst-zacht);line-height:1.5;padding-top:.45rem}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem;margin:1rem 0 0 40px}.choice{border:1px solid var(--rand);border-radius:10px;padding:.7rem .75rem;display:flex;align-items:center;gap:.6rem;cursor:pointer;font-size:13.5px;line-height:1.35}.choice:hover{border-color:var(--blauw);background:#fbfdff}.choice input{accent-color:var(--blauw)}.answer-input{margin:1rem 0 0 40px;max-width:360px;width:calc(100% - 40px);border:1px solid var(--rand);border-radius:10px;padding:.75rem .8rem;font:inherit;font-size:14px;outline:none}.answer-input:focus{border-color:var(--blauw)}.feedback{margin:1rem 0 0 40px;border-radius:10px;padding:.8rem .9rem;font-size:13px;line-height:1.5}.feedback strong{display:block;margin-bottom:.2rem}.feedback.good{background:var(--groen-bg);color:var(--groen)}.feedback.bad{background:var(--rood-bg);color:var(--rood)}.feedback .answer-line{margin-top:.3rem;color:#4b5563}.feedback.bad .answer-line{color:#7c2d12}.action-row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-top:1.3rem}.primary{background:var(--blauw);border:1px solid var(--blauw);border-radius:999px;color:#fff;font:inherit;font-weight:700;font-size:13px;padding:.72rem 1.1rem;cursor:pointer}.primary:hover{filter:brightness(.94)}.secondary{background:#fff;border:1px solid var(--rand);border-radius:999px;color:var(--blauw);font:inherit;font-weight:600;font-size:13px;padding:.72rem 1.1rem;cursor:pointer;text-decoration:none}.secondary:hover{border-color:var(--blauw)}.summary{margin-top:1.25rem;background:var(--kaart);border:.5px solid var(--rand);border-radius:14px;padding:1.15rem}.summary h3{font-size:18px;color:var(--blauw)}.summary p{font-size:13px;color:var(--tekst-zacht);line-height:1.5;margin-top:.45rem}.summary .result{font-size:28px;color:var(--roze);font-weight:700;margin-top:.5rem}.error-list{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.75rem}.error-tag{font-size:12px;padding:.4rem .55rem;background:var(--amber-bg);color:var(--amber);border-radius:999px}.hidden{display:none!important}.voet{text-align:center;padding:1rem;font-size:11px;color:#b8bfc9}@media(max-width:880px){.module-grid,.level-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dash{grid-template-columns:1fr}.progress-row{grid-template-columns:105px 1fr auto}}@media(max-width:620px){.site-header{padding:.75rem 1rem}.school-naam{display:none}.site-toolbar{padding:.55rem 1rem}.app{padding:1.4rem .9rem 2.4rem}.module-grid,.level-grid{grid-template-columns:1fr}.choices{grid-template-columns:1fr;margin-left:0}.q-help,.answer-input,.feedback{margin-left:0;width:100%}.student-status{margin-left:0;width:100%}.q-top{gap:.55rem}.q-prompt{font-size:14px}}

<script>
const STORAGE_KEY='latijn-1A1';
const CONFIG=window.LATIJN_VOORTGANG_SYNC||{};
const PERSONS=[
  {id:'1sg',label:'1e persoon enkelvoud',short:'ik',index:0},
  {id:'2sg',label:'2e persoon enkelvoud',short:'jij',index:1},
  {id:'3sg',label:'3e persoon enkelvoud',short:'hij/zij/het',index:2},
  {id:'1pl',label:'1e persoon meervoud',short:'wij',index:3},
  {id:'2pl',label:'2e persoon meervoud',short:'jullie',index:4},
  {id:'3pl',label:'3e persoon meervoud',short:'zij',index:5}
];
const PERSON_BY_ID=Object.fromEntries(PERSONS.map(p=>[p.id,p]));
const TYPE_LABEL={a:'a-vervoeging',e:'e-vervoeging',cons:'consonantvervoeging',shorti:'korte i-vervoeging',longi:'lange i-vervoeging',irregular:'onregelmatig'};
const VERBS=[
  V('amare','ama','a','liefhebben / houden van'),V('vocare','voca','a','noemen, roepen'),V('sperare','spera','a','hopen'),V('curare','cura','a','zorgen voor'),V('laborare','labora','a','werken, zwoegen'),V('negare','nega','a','weigeren, ontkennen'),V('putare','puta','a','denken, menen'),
  V('habere','habe','e','hebben, houden'),V('monere','mone','e','waarschuwen, aansporen'),V('tenere','tene','e','vasthouden, houden'),V('timere','time','e','bang zijn, vrezen'),V('valere','vale','e','gezond zijn, krachtig zijn'),V('videre','vide','e','zien'),V('placere','place','e','bevallen, leuk zijn'),
  V('credere','cred','cons','geloven'),V('dicere','dic','cons','zeggen, spreken'),V('ducere','duc','cons','leiden'),V('mittere','mitt','cons','sturen, zenden'),V('petere','pet','cons','zoeken, vragen, verlangen'),V('ponere','pon','cons','plaatsen, zetten'),V('currere','curr','cons','lopen, rennen'),V('vincere','vinc','cons','overwinnen'),V('legere','leg','cons','lezen, verzamelen'),V('cadere','cad','cons','vallen'),V('tangere','tang','cons','aanraken'),
  V('capere','capi','shorti','nemen, grijpen, vangen'),V('facere','faci','shorti','maken, doen'),V('fugere','fugi','shorti','vluchten'),V('rapere','rapi','shorti','grijpen, roven'),V('accipere','accipi','shorti','ontvangen'),V('interficere','interfici','shorti','doden'),V('eripere','eripi','shorti','afpakken, stelen'),V('dimittere','dimitti','shorti','wegzenden, laten vallen'),V('incipere','incipi','shorti','beginnen'),
  V('audire','audi','longi','horen, luisteren'),V('venire','veni','longi','komen'),V('reperire','reperi','longi','vinden, aantreffen'),
  V('esse','', 'irregular','zijn',{praesens:['sum','es','est','sumus','estis','sunt'],imperfectum:['eram','eras','erat','eramus','eratis','erant']}),
  V('posse','', 'irregular','kunnen',{praesens:['possum','potes','potest','possumus','potestis','possunt'],imperfectum:['poteram','poteras','poterat','poteramus','poteratis','poterant']}),
  V('velle','', 'irregular','willen',{praesens:['volo','vis','vult','volumus','vultis','volunt'],imperfectum:['volebam','volebas','volebat','volebamus','volebatis','volebant']}),
  V('ire','', 'irregular','gaan',{praesens:['eo','is','it','imus','itis','eunt'],imperfectum:['ibam','ibas','ibat','ibamus','ibatis','ibant']})
];
function V(inf,stem,type,nl,forms={}){return{inf,stem,type,nl,forms}}
const MODULES={
  praesens:{key:'praesens',title:'Indicatief praesens',short:'Praesens',description:'Herken, vorm en gebruik de tegenwoordige tijd. De oefeningen gebruiken uitsluitend basiswerkwoorden uit Ludus 2A, 2B, 3A en 3B.',rules:['De uitgang vertelt wie de handeling doet: -o = ik, -s = jij, -t = hij/zij/het.','Let bij de 3e persoon meervoud op de juiste vorm: -ant, -ent, -unt of -iunt.','Bij esse, posse, velle en ire leer je de vormen als vaste rij.']},
  imperfectum:{key:'imperfectum',title:'Indicatief imperfectum',short:'Imperfectum',description:'Oefen de verleden tijd die iets beschrijft dat bezig was of herhaald gebeurde. De oefeningen gebruiken uitsluitend basiswerkwoorden uit Ludus 2A, 2B, 3A en 3B.',rules:['Zoek eerst het tijdssignaal: -ba-, -eba- of -ieba-.','Daarna lees je de uitgang: -m, -s, -t, -mus, -tis, -nt.','Bij esse, posse, velle en ire herken je vaste vormen zoals eram, poteram, volebam en ibam.']}
};
function normalize(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,;:!?\-–—]/g,'').replace(/\s+/g,' ')}
function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{version:2,name:'',vervoegingenV1:{modules:{},errors:{}}}}catch(e){return{version:2,name:'',vervoegingenV1:{modules:{},errors:{}}}}}
function save(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return d}
function data(){const d=load();d.vervoegingenV1=d.vervoegingenV1||{modules:{},errors:{}};d.vervoegingenV1.modules=d.vervoegingenV1.modules||{};d.vervoegingenV1.errors=d.vervoegingenV1.errors||{};return d}
function moduleState(d,key){if(!d.vervoegingenV1.modules[key])d.vervoegingenV1.modules[key]={exercises:{},errors:{}};return d.vervoegingenV1.modules[key]}
function form(v,tense,pid){const i=PERSON_BY_ID[pid].index;if(v.type==='irregular')return v.forms[tense][i];if(tense==='praesens'){if(v.type==='a')return i===0?v.stem.slice(0,-1)+'o':v.stem+['','s','t','mus','tis','nt'][i];if(v.type==='e')return v.stem+['o','s','t','mus','tis','nt'][i];if(v.type==='cons')return v.stem+['o','is','it','imus','itis','unt'][i];return v.stem+['o','s','t','mus','tis','unt'][i]}if(v.type==='a'||v.type==='e')return v.stem+['bam','bas','bat','bamus','batis','bant'][i];return v.stem+['ebam','ebas','ebat','ebamus','ebatis','ebant'][i]}
function timeSignal(v,tense){if(tense==='praesens')return 'geen apart tijdssignaal';if(v.type==='irregular'){return({esse:'era',posse:'poter',velle:'vole',ire:'iba'})[v.inf]||'—'};if(v.type==='a'||v.type==='e')return '-ba-';return '-eba- / -ieba-'}
function verbStemText(v){if(v.type==='irregular')return 'vaste, onregelmatige vormen';return `<strong>${v.stem}-</strong>`}
function seeded(seed){let x=seed>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}
function choose(a,r){return a[Math.floor(r()*a.length)]}
function shuffled(a,r){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function distinct(a){return [...new Set(a)]}
function personOptionLabels(r,correct){return shuffled(PERSONS.map(p=>p.label),r)}
function optionQuestion(prompt,opts,answerText,explanation,errorType,help){const list=opts.map((text,i)=>({id:'o'+i,text}));const target=list.find(x=>x.text===answerText);return{kind:'mc',prompt,options:list,answer:target?target.id:list[0].id,explanation,errorType,help}}
function inputQuestion(prompt,answer,explanation,errorType,help,accepted=[]){return{kind:'input',prompt,answer,accepted:[answer,...accepted],explanation,errorType,help}}
function formOptions(v,tense,pid,r){const current=form(v,tense,pid);let candidates=[];PERSONS.filter(p=>p.id!==pid).forEach(p=>candidates.push(form(v,tense,p.id)));shuffled(VERBS.filter(x=>x.inf!==v.inf),r).slice(0,6).forEach(x=>candidates.push(form(x,tense,pid)));candidates=distinct(candidates.filter(x=>x!==current));return shuffled([current,...candidates.slice(0,3)],r)}
function personQ(tense,v,pid,r){const p=PERSON_BY_ID[pid];const opts=personOptionLabels(r,p.label);return optionQuestion(`Welke persoon en welk getal heeft <em>${form(v,tense,pid)}</em>?`,opts,p.label,`De uitgang van <em>${form(v,tense,pid)}</em> vertelt dat dit <strong>${p.label}</strong> is.`,p.id.endsWith('pl')?'getal':'persoon',tense==='praesens'?'Lees vooral het einde van de vorm. Dat einde vertelt wie de handeling doet.':'Zoek eerst het tijdssignaal. Lees daarna het einde: -m, -s, -t, -mus, -tis of -nt.')}
function verbQ(tense,v,pid,r){const opts=shuffled([v.inf,...shuffled(VERBS.filter(x=>x.inf!==v.inf),r).slice(0,3).map(x=>x.inf)],r);return optionQuestion(`Bij welk grondwoord hoort <em>${form(v,tense,pid)}</em>?`,opts,v.inf,`De vorm <em>${form(v,tense,pid)}</em> hoort bij <strong>${v.inf}</strong>: “${v.nl}”.`,'werkwoord','Kijk naar het begin van de vorm. Dat is de stam of een herkenbaar stukje van het grondwoord.')}
function signalQ(tense,v,pid,r){if(tense==='praesens'){const p=PERSON_BY_ID[pid];const ending=form(v,tense,pid).slice(-({'1sg':1,'2sg':1,'3sg':1,'1pl':3,'2pl':3,'3pl':3}[pid]||1));const options=shuffled([ending,'-ba-','-era-','-ei-'],r);return optionQuestion(`Welk stukje helpt je het best te zien dat <em>${form(v,tense,pid)}</em> ${p.label} is?`,options,ending,`Kijk naar het einde <strong>${ending}</strong>. Dat vertelt wie de handeling doet.`,'uitgang','Bij een praesensvorm lees je eerst de uitgang. Die vertelt persoon en getal.')}const sig=timeSignal(v,tense);const options=shuffled([sig,'-ba-','-eba- / -ieba-','-er-'],r);return optionQuestion(`Welk tijdssignaal herken je in <em>${form(v,tense,pid)}</em>?`,options,sig,`In <em>${form(v,tense,pid)}</em> herken je <strong>${sig}</strong>. Dat helpt je zien dat de vorm imperfectum is.`,'tijdssignaal','Zoek in het midden van de vorm. Bij gewone werkwoorden zie je -ba-, -eba- of -ieba-.')}
function chooseFormQ(tense,v,pid,r){const p=PERSON_BY_ID[pid];const opts=formOptions(v,tense,pid,r);return optionQuestion(`Kies de juiste <strong>${tense}</strong>-vorm van <em>${v.inf}</em> voor <strong>${p.label}</strong>.`,opts,form(v,tense,pid),`Voor ${p.label} krijg je <strong>${form(v,tense,pid)}</strong>. ${tense==='imperfectum'?'Let op het tijdssignaal én de uitgang.':'Let op de stam én de uitgang.'}`,tense==='imperfectum'?'tijd':'uitgang','Werk in drie stapjes: kies de stam, voeg de tijd toe en eindig met de juiste uitgang.')}
function makeFormQ(tense,v,pid){const p=PERSON_BY_ID[pid];return inputQuestion(`Maak de <strong>${tense}</strong>-vorm van <em>${v.inf}</em> voor <strong>${p.label}</strong>.`,form(v,tense,pid),`Vertrek van ${verbStemText(v)} en vorm <strong>${form(v,tense,pid)}</strong>.`,tense==='imperfectum'?'tijdssignaal':'uitgang','Zeg eerst hardop: werkwoord — tijd — persoon. Bouw daarna pas de vorm.')}
function conjugationQ(v,r){const opts=shuffled([TYPE_LABEL[v.type],...shuffled(Object.values(TYPE_LABEL).filter(x=>x!==TYPE_LABEL[v.type]&&x!=='onregelmatig'),r).slice(0,3)],r);return optionQuestion(`Tot welke vervoeging behoort <em>${v.inf}</em>?`,opts,TYPE_LABEL[v.type],`<em>${v.inf}</em> behoort tot de <strong>${TYPE_LABEL[v.type]}</strong>. Dat helpt je de juiste vorm te bouwen.`,'stam','Kijk naar de infinitief: -are, -ere, -ere met korte i, of -ire. Onregelmatige werkwoorden leer je als vaste rij.')}
function analysisQ(tense,v,pid,r){const p=PERSON_BY_ID[pid];const correct=`${tense} · ${p.label}`;const candidates=[correct,`${tense} · ${PERSONS[(p.index+1)%6].label}`,`${tense==='praesens'?'imperfectum':'praesens'} · ${p.label}`,`${tense==='praesens'?'imperfectum':'praesens'} · ${PERSONS[(p.index+2)%6].label}`];const opts=shuffled(distinct(candidates),r);return optionQuestion(`Welke analyse klopt bij <em>${form(v,tense,pid)}</em>?`,opts,correct,`<em>${form(v,tense,pid)}</em> is <strong>${tense}</strong>, <strong>${p.label}</strong>.`,tense==='imperfectum'?'tijd':'persoon','Bij een analyse bepaal je eerst de tijd. Daarna lees je de uitgang voor persoon en getal.')}
function correctionQ(tense,v,pid,r){const wrongPid=PERSONS[(PERSON_BY_ID[pid].index+1+(Math.floor(r()*4)))%6].id;let wrong=form(v,tense,wrongPid);if(wrong===form(v,tense,pid))wrong=form(v,tense,PERSONS[(PERSON_BY_ID[pid].index+2)%6].id);const p=PERSON_BY_ID[pid];return inputQuestion(`Een leerling schrijft <em>${wrong}</em>, maar bedoelt <strong>${tense} · ${p.label}</strong> van <em>${v.inf}</em>. Verbeter de vorm.`,form(v,tense,pid),`De juiste vorm is <strong>${form(v,tense,pid)}</strong>. De vorm <em>${wrong}</em> heeft een andere uitgang en hoort dus bij een andere persoon of een ander getal.`,'uitgang','Vergelijk het einde van de foute vorm met de uitgang die je voor de gevraagde persoon nodig hebt.')}
function meaningQ(tense,v,pid,r){const p=PERSON_BY_ID[pid];const correct=`${p.short} — ${v.nl}`;const distractors=shuffled(VERBS.filter(x=>x.inf!==v.inf),r).slice(0,3).map(x=>`${p.short} — ${x.nl}`);const opts=shuffled([correct,...distractors],r);return optionQuestion(`Welke omschrijving past bij <em>${form(v,tense,pid)}</em>?`,opts,correct,`Het grondwoord is <strong>${v.inf}</strong>: “${v.nl}”. De uitgang toont ${p.label}.`,'betekenis','Zoek eerst het grondwoord. Lees daarna de uitgang voor wie de handeling doet.')}
function sentenceQ(tense,v,pid,r){const subjects={"1sg":'ego',"2sg":'tu',"3sg":'puer',"1pl":'nos',"2pl":'vos',"3pl":'milites'};const subject=subjects[pid];const opts=formOptions(v,tense,pid,r);return optionQuestion(`Vul aan: <em>${subject} …</em> Kies de correcte <strong>${tense}</strong>-vorm van <em>${v.inf}</em>.`,opts,form(v,tense,pid),`Bij <em>${subject}</em> hoort ${PERSON_BY_ID[pid].label}. Daarom kies je <strong>${form(v,tense,pid)}</strong>.`,'congruentie','Kijk eerst naar het onderwerp. Dat vertelt welke persoon en welk getal je nodig hebt.')}
function makeQuestions(key,level,exercise){const r=seeded((key==='praesens'?401:801)+level*97+exercise*19);const qs=[];for(let i=0;i<10;i++){const v=choose(VERBS,r),pid=choose(PERSONS,r).id;if(level===1){if(exercise===1)qs.push(personQ(key,v,pid,r));else if(exercise===2)qs.push(verbQ(key,v,pid,r));else if(exercise===3)qs.push(signalQ(key,v,pid,r));else qs.push(chooseFormQ(key,v,pid,r));}else if(level===2){if(exercise===1)qs.push(makeFormQ(key,v,pid));else if(exercise===2)qs.push(sentenceQ(key,v,pid,r));else if(exercise===3)qs.push(conjugationQ(v,r));else qs.push(meaningQ(key,v,pid,r));}else{if(exercise===1)qs.push(correctionQ(key,v,pid,r));else if(exercise===2)qs.push(analysisQ(key,v,pid,r));else if(exercise===3)qs.push(i<5?makeFormQ(key,v,pid):sentenceQ(key,v,pid,r));else qs.push(i<5?chooseFormQ(key,v,pid,r):meaningQ(key,v,pid,r));}}return qs}
function getStats(d,key){const st=moduleState(d,key),ex=st.exercises||{},byLevel={};for(let l=1;l<=3;l++){const vals=[];for(let e=1;e<=4;e++){const x=ex[`${l}-${e}`];vals.push(x&&typeof x.best==='number'?x.best:null)}const done=vals.filter(v=>v!==null).length,sum=vals.reduce((s,v)=>s+(v===null?0:v),0);byLevel[l]={vals,done,sum,passed:done===4&&sum>=32}}const highest=byLevel[3].passed?4:byLevel[2].passed?3:byLevel[1].passed?2:1;const all=Object.values(ex).map(x=>x.best).filter(v=>typeof v==='number');return{byLevel,highest,completed:all.length,total:12,average:all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length*10):0}}
function allStats(d){return Object.fromEntries(Object.keys(MODULES).map(k=>[k,getStats(d,k)]))}
function app(){return document.getElementById('app')}
function esc(s){return String(s||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function setName(v){const d=data();d.name=v.trim();save(d);render()}
function renderHome(){const d=data(),stats=allStats(d);app().innerHTML=`<section class="intro"><h2>Vervoegingen</h2><p>Werk stap voor stap aan de <strong>indicatief praesens</strong> en het <strong>indicatief imperfectum</strong>. Per werkwoordstijd maak je vier oefeningen per niveau. Je gaat pas verder wanneer je over die vier oefeningen samen minstens <strong>32/40 = 80%</strong> behaalt.</p></section><div class="student-bar"><label for="studentName">Jouw naam</label><input id="studentName" value="${esc(d.name)}" placeholder="Voornaam en naam" autocomplete="name"><span class="student-status">${d.name?'Je voortgang wordt op dit toestel bewaard en doorgestuurd naar het dashboard.':'Vul je naam in om je voortgang te bewaren en later in het dashboard te zien.'}</span></div><section class="dash"><div class="dash-card"><h3>Jouw voortgang</h3><div class="progress-list">${Object.keys(MODULES).map(k=>{const s=stats[k];return `<div class="progress-row"><strong>${MODULES[k].short}</strong><div class="progress-track"><div class="progress-fill" style="width:${Math.round(s.completed/s.total*100)}%"></div></div><span class="badge ${s.completed===12?'good':''}">${s.completed}/${s.total}</span></div>`}).join('')}</div></div><div class="dash-card"><h3>Zo werk je</h3><p><strong>Niveau 1</strong>: herkennen.<br><strong>Niveau 2</strong>: vormen en bepalen.<br><strong>Niveau 3</strong>: toepassen en fouten verbeteren.<br><br>Bij elke fout krijg je meteen een korte uitleg.</p></div></section><section class="module-grid">${Object.keys(MODULES).map(k=>{const m=MODULES[k],s=stats[k],icon=k==='praesens'?'<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/><path d="M7 3v6M14 9v6M10 15v6"/></svg>';return `<a class="module-card" href="#${k}"><div class="module-icon">${icon}</div><h3>${m.title}</h3><p>${m.description}</p><span class="badge ${s.completed===12?'good':''}">${s.completed}/12 oefeningen</span><div class="arrow">›</div></a>`}).join('')}</section>`;document.getElementById('studentName').addEventListener('change',e=>setName(e.target.value))}
function renderModule(key){const d=data(),m=MODULES[key],s=getStats(d,key);app().innerHTML=`<section class="overview"><div class="crumb"><a href="#home">‹ Alle vervoegingen</a><span>›</span><span>${m.title}</span></div><div class="module-title"><div><h2>${m.title}</h2><p>${m.description}</p></div><div class="score-box"><strong>${s.completed}/12</strong><span>oefeningen gemaakt</span></div></div><section class="dash"><div class="dash-card"><h3>Wat moet je onthouden?</h3><p>${m.rules.map(x=>'• '+x).join('<br>')}</p></div><div class="dash-card"><h3>Jouw route</h3><p>Voltooi de vier oefeningen van een niveau. Samen heb je minstens <strong>32/40</strong> nodig om het volgende niveau te openen.</p></div></section><section class="level-grid">${[1,2,3].map(l=>levelCard(key,l,s)).join('')}</section></section>`}
function levelCard(key,l,s){const unlocked=l<=s.highest,info=s.byLevel[l],pct=Math.round(info.sum/40*100);return `<article class="level-card ${unlocked?'':'locked'}"><h3>Niveau ${l}</h3><p class="sub">${l===1?'Herkennen en begrijpen.':l===2?'Vormen, bepalen en koppelen.':'Toepassen en fouten verbeteren.'}</p><p class="level-score">Beste scores samen: <strong>${info.sum}/40</strong></p><div class="mini-track"><div class="mini-fill" style="width:${pct}%"></div></div><div class="exercise-list">${[1,2,3,4].map(e=>{const x=info.vals[e-1];return `<button class="exercise-btn" ${unlocked?'':'disabled'} data-start="${key}|${l}|${e}"><strong>Oefening ${e}</strong><span class="${x!==null&&x>=8?'passed':''}">${x===null?'nog niet gemaakt':`${x}/10`}</span></button>`}).join('')}</div>${!unlocked?`<p class="locked-note">Maak niveau ${l-1} volledig af en behaal samen minstens 32/40.</p>`:info.passed?'<p class="locked-note" style="background:var(--groen-bg);color:var(--groen)">Niveau behaald. Goed gewerkt.</p>':''}</article>`}
function renderExercise(key,l,e){const m=MODULES[key],qs=makeQuestions(key,l,e),d=data(),prior=(moduleState(d,key).exercises||{})[`${l}-${e}`];app().innerHTML=`<section class="exercise-view"><div class="crumb"><a href="#${key}">‹ ${m.title}</a><span>›</span><span>Niveau ${l}, oefening ${e}</span></div><div class="exercise-head"><div><h2>${m.title}</h2><p>Niveau ${l} · oefening ${e} · 10 vragen</p></div><div class="score-box"><strong>${prior?`${prior.best}/10`:'—'}</strong><span>beste score</span></div></div><div class="question-list">${qs.map((q,i)=>renderQuestion(q,i)).join('')}</div><div class="action-row"><button class="primary" id="checkBtn">Verbeter mijn oefening</button><a class="secondary" href="#${key}">Terug naar overzicht</a></div><div class="summary hidden" id="summary"></div></section>`;document.getElementById('checkBtn').addEventListener('click',()=>checkExercise(key,l,e,qs))}
function renderQuestion(q,i){const content=q.kind==='mc'?`<div class="choices">${q.options.map(o=>`<label class="choice"><input type="radio" name="q${i}" value="${o.id}"><span>${o.text}</span></label>`).join('')}</div>`:`<input class="answer-input" id="q${i}" autocomplete="off" placeholder="Schrijf je antwoord hier">`;return `<article class="question" id="question-${i}"><div class="q-top"><div class="q-no">${i+1}</div><div class="q-prompt">${q.prompt}</div></div><details class="q-help"><summary>Hulp nodig? Werk in stapjes.</summary><p>${q.help}</p></details>${content}<div class="feedback hidden" id="feedback-${i}"></div></article>`}
function selected(q,i){if(q.kind==='mc'){const x=document.querySelector(`input[name="q${i}"]:checked`);return x?x.value:''}return document.getElementById('q'+i).value}
function checkExercise(key,l,e,qs){let score=0;const errors={};qs.forEach((q,i)=>{const got=selected(q,i),good=q.kind==='mc'?got===q.answer:q.accepted.map(normalize).includes(normalize(got)),box=document.getElementById('question-'+i),fb=document.getElementById('feedback-'+i);box.classList.remove('correct','wrong');box.classList.add(good?'correct':'wrong');if(good)score++;else errors[q.errorType]=(errors[q.errorType]||0)+1;fb.className='feedback '+(good?'good':'bad');const answer=q.kind==='mc'?q.options.find(x=>x.id===q.answer).text:q.answer;fb.innerHTML=good?`<strong>Juist.</strong>${q.explanation}`:`<strong>Nog niet juist.</strong><div class="answer-line">Juiste antwoord: <strong>${answer}</strong>.</div><div class="answer-line">${q.explanation}</div>`});const d=data(),st=moduleState(d,key),id=`${l}-${e}`,old=st.exercises[id]||{};st.exercises[id]={best:Math.max(old.best||0,score),last:score,attempts:(old.attempts||0)+1,updatedAt:new Date().toISOString()};Object.entries(errors).forEach(([k,v])=>{st.errors[k]=(st.errors[k]||0)+v;d.vervoegingenV1.errors[k]=(d.vervoegingenV1.errors[k]||0)+v});d.vervoegingenV1.lastActivity=new Date().toISOString();d.vervoegingenV1.lastExercise=`${MODULES[key].title} · niveau ${l}, oefening ${e}`;save(d);sendProgress(d);const stats=getStats(d,key),top=Object.entries(errors).sort((a,b)=>b[1]-a[1]),summary=document.getElementById('summary');summary.classList.remove('hidden');summary.innerHTML=`<h3>${score>=8?'Goed gedaan.':'Oefen nog eens verder.'}</h3><div class="result">${score}/10</div><p>${score>=8?'Je behaalde minstens 80% op deze oefening. Je beste score is bewaard.':'Je beste score is bewaard. Lees de uitleg bij je fouten en probeer deze oefening later opnieuw.'}</p><p>Niveau ${l}: beste scores samen <strong>${stats.byLevel[l].sum}/40</strong>. ${stats.byLevel[l].passed?'Het volgende niveau is nu open.':'Je hebt 32/40 nodig om door te gaan.'}</p>${top.length?`<div class="error-list">${top.map(([k])=>`<span class="error-tag">Aandachtspunt: ${errorLabel(k)}</span>`).join('')}</div>`:''}<div class="action-row"><a class="primary" href="#${key}">Naar mijn overzicht</a><button class="secondary" id="retryBtn">Deze oefening opnieuw maken</button></div>`;document.getElementById('retryBtn').addEventListener('click',()=>renderExercise(key,l,e));summary.scrollIntoView({behavior:'smooth',block:'start'})}
function errorLabel(k){return({stam:'stam vinden',tijd:'werkwoordstijd herkennen',tijdssignaal:'tijdssignaal herkennen',persoon:'persoon herkennen',getal:'getal herkennen',uitgang:'juiste uitgang',werkwoord:'werkwoord herkennen',congruentie:'onderwerp en vorm laten passen',betekenis:'betekenis koppelen',spelling:'vorm correct schrijven'})[k]||k}
function progressSummary(d){const stats=allStats(d),modules={};let completed=0,total=0,weighted=0;Object.keys(stats).forEach(k=>{const s=stats[k];completed+=s.completed;total+=s.total;weighted+=s.average*s.completed;modules[k]={completed:s.completed,total:s.total,average:s.average,highestOpen:s.highest,complete:s.completed===12&&s.byLevel[3].passed}});const errors=d.vervoegingenV1.errors||{},ordered=Object.entries(errors).sort((a,b)=>b[1]-a[1]);return{name:d.name||'',classId:CONFIG.classId||'1A1',school:CONFIG.school||'athena campus Pottelberg',course:'Latijn 1A1',product:'vervoegingen-1ejaar',schema:2,lastActivity:d.vervoegingenV1.lastActivity||new Date().toISOString(),lastExercise:d.vervoegingenV1.lastExercise||'',completed,total,average:completed?Math.round(weighted/completed):0,modules,errors,errorCount:Object.values(errors).reduce((s,v)=>s+Number(v||0),0),topError:ordered.length?errorLabel(ordered[0][0]):''}}
function sendProgress(d){if(!d.name||!CONFIG.enabled||!CONFIG.endpoint||String(CONFIG.endpoint).includes('PLAK_HIER'))return;const payload={type:'latijn-voortgang',sentAt:new Date().toISOString(),summary:progressSummary(d)};try{fetch(CONFIG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).catch(()=>{})}catch(e){}}
function route(){const hash=decodeURIComponent(location.hash.slice(1));if(!hash||hash==='home'){renderHome();return}const p=hash.split('|');if(MODULES[p[0]]){if(p.length===1)renderModule(p[0]);else renderExercise(p[0],Number(p[1]),Number(p[2]));return}renderHome()}
window.addEventListener('hashchange',route);document.addEventListener('click',e=>{const b=e.target.closest('[data-start]');if(b){location.hash='#'+b.dataset.start}});route();
</script>
</body>
